version: 2
skybox: ./testObjects/skybox
camera:
  position: [0.0, 0.0, 3.0]
  yaw: -90.0
  pitch: 0.0
objects:
  - name: sponza
    model: scenes/sponza/sponza.obj
    transform:
      position: [0.0, 0.0, 0.0]
      rotation: [0.0, 1.0, 0.0, 0.0]
      scale: [0.05, 0.05, 0.05]
    body:
      static: true

  # The sun. This used to be hardcoded in computeLight.
  - name: sun
    components:
      - type: DirectionalLight
        props:
          direction: [-0.2, -1.0, -0.3]
          ambient: [0.2, 0.2, 0.2]
          diffuse: [0.5, 0.5, 0.5]
          specular: [1.0, 1.0, 1.0]

  # The flashlight, toggled with F.
  - name: flashlight
    components:
      - type: SpotLight
        props:
          followCamera: true
          cutOff: 12.5
          outerCutOff: 15.0

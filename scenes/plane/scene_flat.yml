version: 2
skybox: ./testObjects/skybox
camera:
  position: [0.0, 2.0, 8.0]
  yaw: -90.0
  pitch: -10.0
objects:
  - name: plane
    model: scenes/plane/plane.obj
    transform:
      position: [0.0, 0.0, 0.0]
      rotation: [0.0, 1.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    body:
      static: true

  # Lights are scene data now; these used to be hardcoded in computeLight.
  # Note: plane.obj has no diffuse texture, and the fragment shader's
  # missing-texture branch bypasses lighting entirely, so nothing here is
  # visible on the plane itself. Point lights are demonstrated on Sponza.
  - name: sun
    components:
      - type: DirectionalLight

  - name: flashlight
    components:
      - type: SpotLight
